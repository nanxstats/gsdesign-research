project:
  type: default
  output-dir: ../docs

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    embed-resources: true
    code-fold: true
    code-tools: false
    code-links:
      - text: GitHub repository
        icon: github
        href: https://github.com/nanxstats/gsdesign-research
      - text: Report source
        icon: file-code
        href: https://github.com/nanxstats/gsdesign-research/blob/main/report/index.qmd
    fig-width: 7.5
    fig-height: 4.2
    df-print: kable

execute:
  echo: false
  warning: false
  message: false
